name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile & Run Test Suite
        run: make test
      - name: Run Smoke Benchmark (SF 0.05)
        run: java -Xmx2g -cp target/classes dev.wixforth.columnar.benchmark.BenchmarkMain --sf=0.05 --warmup=1 --runs=2
